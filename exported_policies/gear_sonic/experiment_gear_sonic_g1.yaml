# GEAR-SONIC via tml_humanoid_deploy (Python): matches gear_sonic_deploy split ONNX layout.
#
# C++ deploy (reference): ``g1_deploy_onnx_ref`` loads
#   --encoder-model  <encoder.onnx>   (``export_universal_token_encoders_as_onnx``)
#   --model          <decoder.onnx>   (``export_universal_token_decoder_as_onnx``, e.g. g1_dyn)
#   --obs-config     observation_config.yaml
#
# Split ONNX (git-lfs) lives next to this YAML:
#   exported_policies/gear_sonic/model_encoder.onnx
#   exported_policies/gear_sonic/model_decoder.onnx
# Or set gear_sonic_encoder_onnx_path / gear_sonic_decoder_onnx_path explicitly.
#
# Full multi-encoder ``*_encoder.onnx`` expects a large flat buffer; if init fails with a dim
# mismatch, set ``gear_sonic_encoder_tokenizer_slice: [start, end)`` so the G1 tokenizer
# (length = 2*num_future_frames*num_dof + 6*num_future_frames + num_future_frames) is pasted
# at the right offset (see exporter console output).
#
# Fused alternative: set ``onnx_model_path`` to a single ``*_g1.onnx`` and remove/ignore split paths.
#
# Real robot (IMU + joints only; no root estimator):
#   python run_controller.py --config exported_policies/gear_sonic/experiment_gear_sonic_g1.yaml --net <iface>

rl_policy:
  use_gear_sonic_g1_onnx: True
  use_streaming_motion: False
  use_contact: False
  use_chip: False

  # Split ONNX next to this YAML (tracked with git-lfs).
  gear_sonic_deploy_policy_dir: "exported_policies/gear_sonic"
  gear_sonic_encoder_onnx_name: "model_encoder.onnx"
  gear_sonic_decoder_onnx_name: "model_decoder.onnx"

  # onnx_model_path: "path/to/model_step_XXXXXX_g1.onnx"

  ref_motion_path: "../twist_lafan_new/AMASS_g1_GMR8_Transitions_mazen_c3d_kick_walk_stageii.npz"
  #contact_labels_path: "exported_policies/zhen_terrain/stitched_motion_contact_labels_grasp.npy"

  gear_sonic_num_future_frames: 5
  lookahead_frame_skips: 1
  init_at_first_frame: False
  ref_motion_start_index: 0
  gear_sonic_num_dof: 29

  # terrain_boxes:
  #   step_1:
  #       pos: [0.75, 0.0, 0.17]
  #       size: [1.0, 1.5, 0.34]
  #   step_2:
  #       pos: [0.8, 0.0, 0.54]
  #       size: [1.0, 1.5, 0.36]

  # Optional dynamic free box (spawns a body with freejoint and gravity/collision enabled).
  # free_box_pos: [-0.0, 0.0, 0.16]
  # free_box_size: [0.3, 0.3, 0.3]
  # free_box_mass: 0.5
  # free_box_rgba: [0.65, 0.45, 0.35, 1.0]

  # Encoder mode index (0 = first encoder in ``encoders_to_iterate``, usually ``g1``).
  gear_sonic_encoder_index: 0.0
  # MuJoCo free-joint qvel[3:6] is BODY-FRAME angular velocity (confirmed by integration test:
  # at 90-deg yaw, qvel=[1,0,0] rotates around world y = body x).  IMU gyro on real hardware is
  # also body-frame.  Default False = pass omega as-is (already body frame).
  # Set True only if your driver supplies world-frame angular velocity.
  gear_sonic_omega_is_world_frame: False
  # Warp ref heading into the robot's initial frame (C++ ComputeApplyDeltaHeading).
  # Needed when use_root_state is False: IMU heading is reset to 0 while clips often start ~±90°.
  gear_sonic_apply_heading_alignment: True
  # True: 10-step ring buffer oldest→newest (matches StateLogger::GetLatest(..., newest_first=false)).
  gear_sonic_use_history_buffer: True

  # Optional: split ONNX often has no metadata — defaults use utils.params.DEFAULT_POSE / ACTION_SCALE.
  # gear_sonic_default_joint_pos: [ ... 29 floats Isaac order ... ]
  # gear_sonic_action_scale: [ ... 29 floats Isaac order ... ]

  # gear_sonic_encoder_tokenizer_slice: [start, end)

  mujoco_xml_path: "assets/g1/scene_29dof_flat_hand.xml"
  # False: policy uses IMU orientation + joints only (no privileged/odom root pos or lin vel).
  # Required for real-robot --net; sim metrics still use privileged root for reporting.
  use_root_state: False

  control_dt: 0.02
  simulation_dt: 0.005

